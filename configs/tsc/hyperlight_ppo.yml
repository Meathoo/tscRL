includes:
  - configs/tsc/base.yml


model:
  name: hyperlight_ppo
  train_model: True
  test_model: True
  load_model: False
  graphic: True

  phase: True
  one_hot: True
  state_features: ["lane_count", "lane_waiting_count"]
  vehicle_max: 50
  # fixed:    every per-lane count / vehicle_max (original behaviour)
  # capacity: each count / that lane's own storage (length / headway), clipped.
  # The networks differ a lot in road length -- 4x4 is 600-800m, 16x3 is
  # 100-350m, 7x28 is 300m -- so under `fixed` the same reading means very
  # different things across (and within) networks. See transfer/observation.py.
  obs_norm_mode: fixed          # fixed | capacity
  obs_capacity_headway: 7.5     # metres of lane per stopped vehicle
  obs_capacity_clip: 1.5

  learning_rate: 0.0003
  adam_eps: 0.00001
  gamma: 0.99
  gae_lambda: 0.95
  policy_objective: ppo         # ppo | spo
  clip_eps: 0.2
  spo_eps: 0.2                  # SPO probability-ratio hyperparameter; defaults to clip_eps
  clip_vf: 0.2
  entropy_coef: 0.01
  value_coef: 0.5

  # Neither the learning rate nor the entropy bonus decayed, so late training
  # kept taking full-size steps while entropy kept pushing the policy off
  # determinism -- and evaluation is argmax. On Ingolstadt the TEST curve
  # converges by ~episode 50 and then oscillates for 200 more, which is what
  # makes `last` a noisy sample and `best` biased toward the noisier arms.
  # linear decays across the planned update count (episodes x updates/episode).
  lr_anneal: none               # none | linear
  lr_final_frac: 0.0            # linear: learning_rate x this at the end
  entropy_anneal: none          # none | linear
  entropy_final_frac: 0.1       # keep a floor rather than decaying to zero
  reward_scale: 0.05
  reward_mode: queue   # queue | pressure_abs | queue_pressure
  pressure_balance_coef: 0.2     # queue_pressure: penalty weight for abs(in_count - out_count)
  pressure_release_coef: 0    # match learned64_mlp_queue_ep250 baseline
  grad_clip: 0.5

  ppo_epochs: 4
  ppo_rollout_steps: 360
  ppo_minibatch_size: 2048
  value_chunk_size: 16
  test_action_mode: argmax        # argmax | sample
  test_temperature: 1.0
  normalize_advantage: True

  activation: relu                 # relu | tanh
  hyper_actor_arch: mlp            # mlp | iru
  iru_hidden_dim: 64
  iru_actor_steps: 1
  iru_num_blocks: 1
  iru_layer_norm: True
  centralized_critic: False
  centralized_critic_mode: pooled # pooled | concat | graph
  agent_embedding_mode: learned   # one_hot | learned | topology | learned_topology | one_hot_topology | structural
  agent_embedding_dim: 64         # used when agent_embedding_mode=learned or structural

  # --- cross-network transfer (transfer/TRANSFER.md) -------------------------
  # agent_embedding_mode=structural conditions the hypernetwork only on
  # network-independent structural features (lane counts, degrees, phase count,
  # boundary ratio), so the whole meta path can be reused on another roadnet.
  # transfer_checkpoint points at a checkpoint trained on a DIFFERENT network:
  # shape-compatible weights are copied, per-index embeddings and the optimizer
  # are not.  null keeps every existing baseline byte-identical.
  transfer_checkpoint: null
  transfer_strict: False

  # --- dynamic (traffic-state) conditioning (dynamic/DYNAMIC.md) -------------
  # meta gains a term driven by a slow per-intersection EMA of queue,
  # occupancy, pressure, approach imbalance and queue slope. The encoder's
  # output layer is zero-initialised, so with dynamic_scale untouched a run
  # starts numerically identical to the same run without it.
  # Half-life is in decision steps (action_interval seconds each), so 60 is
  # ten minutes of simulated time at the default action_interval of 10.
  dynamic_condition_enabled: False
  dynamic_ema_halflife: 60
  dynamic_hidden_dim: 64
  dynamic_scale: 1.0

  # Optional canonical lane-link movement encoder. It is local-only for the
  # decentralized actor; raw observations remain in the PPO rollout buffer.
  movement_encoder_enabled: False
  movement_token_dim: 64
  movement_encoder_dim: 64
  movement_encoder_heads: 4
  movement_encoder_layers: 1
  movement_encoder_ff_dim: 128
  movement_encoder_dropout: 0.0

  # Directed centralized critic (used when centralized_critic_mode=graph).
  # downstream_to_upstream lets an upstream signal observe downstream spillback.
  graph_critic_hidden_dim: 128
  graph_critic_layers: 2
  graph_critic_heads: 4
  graph_critic_dropout: 0.0
  graph_critic_use_edge_weight: False # binary edges avoid raw 1/length log-bias collapse
  graph_critic_edge_weight_scale: 1.0
  graph_critic_global_pool: True
  graph_message_direction: downstream_to_upstream # downstream_to_upstream | upstream_to_downstream | bidirectional
  graph_critic_film: True
  graph_critic_film_hidden: [64]
  graph_critic_film_scale: 0.1

  topology_aware_embedding: False  # topology-only clean ablation vs learned64 baseline
  topology_hidden_dim: 64         # match the topo64 ablation hidden size

  # CoSLight-style collaborator selection. Off by default to preserve the
  # HyperLight baseline; set cos_enabled=True to use top-k mean-pooled context.
  cos_enabled: False
  cos_top_k: 5
  cos_feature_source: state_meta   # state | meta | state_meta
  cos_context_dim: 128
  cos_state_hidden: [128]
  cos_selector_hidden: [64]
  cos_fusion_mode: concat          # concat | add
  cos_fusion_hidden: []
  cos_policy_coef: 1.0
  cos_entropy_coef: 0.0
  cos_diag_coef: 0.01
  cos_symmetry_coef: 0.01
  cos_self_bias: 0.0
  cos_logit_clip: 0.0              # 0 disables clipping
  cos_deterministic_eval: True
  cos_log_diagnostics: True

  hypernet_type: mlp              # mlp | linear
  actor_hypernet_type: mlp        # mlp | linear
  value_hypernet_type: mlp        # mlp | linear
  
# hyper output part CLOSED
  hyper_head_mode: flat           # flat is the stable pre-RF baseline; layerwise is paper-style ablation; chunked is the Ha et al. factorized head
  hyper_use_bias: True
  hyper_head_init_gain: 1.0
  # chunked head only: target weights are emitted in row-blocks of hyper_chunk_size
  # by one shared generator per layer, conditioned on a learnable chunk embedding.
  # Smaller chunk_size means more sharing and fewer parameters.
  hyper_chunk_size: 8
  hyper_chunk_embed_dim: 16
  # null falls back to hyper_chunk_size; the critic head costs ~2x the actor head,
  # so the two sides can be sized independently.
  hyper_actor_chunk_size: null
  hyper_critic_chunk_size: null
  # 0 keeps the single-Linear generator, where every chunk emits
  # W_h*h + W_c*code_j + b and the agent-dependent block is therefore identical
  # in every chunk. A positive width inserts one hidden layer after the
  # concatenation so the chunk code and the meta vector interact (and, because
  # the wide output head then reads from this width instead of
  # trunk_dim + chunk_embed_dim, 64 is slightly cheaper than 0).
  hyper_chunk_generator_hidden: 0
  # How hyper_rf_init lays the target-layer init into a chunked head (ignored by
  # the other head modes, and by chunked when hyper_rf_init is off).
  #   shared:    one orthogonal chunk_size x in_dim block in the generator bias,
  #              which every chunk reads -- so the generated target matrix starts
  #              as that block tiled down the rows. The 128x160 critic layer comes
  #              out at effective rank ~13 of 128, and only the random chunk-code
  #              path breaks the tie, which is a per-seed amount of symmetry
  #              breaking. This is what every result before 2026-08-24 used.
  #   per_chunk: one orthogonal out_dim x in_dim draw for the whole layer -- the
  #              same one a flat head would make -- sliced across the chunks and
  #              carried by the chunk-code parameters that already exist. Restores
  #              effective rank ~128 at no parameter cost. Needs
  #              hyper_chunk_embed_dim >= n_chunks (16 at chunk_size 8) and, when
  #              hyper_chunk_generator_hidden > 0, that width >= n_chunks too.
  hyper_chunk_rf_mode: shared

# shared base + small hypernetwork residual delta
  # generated: original per-intersection generated MLP weights
  # none: one trainable shared actor (the unmodulated IRU control)
  # film: one shared actor with embedding-conditioned activation modulation
  hyper_adapter_mode: generated   # generated | none | film
  # generated: original per-intersection generated critic weights
  # film: one shared critic with embedding-conditioned hidden activations
  hyper_critic_adapter_mode: generated # generated | film
  hyper_film_scale: 0.1
  hyper_film_init_zero: True       # identity FiLM at initialization
  hyper_residual: False           # True: theta = shared_base + scale * hyper_delta(meta)
  hyper_residual_mode: full       # full | lora | head
  hyper_residual_scale: 0.02      # default shared scale for actor/value residual deltas
  hyper_residual_actor_scale: null # null falls back to hyper_residual_scale
  hyper_residual_value_scale: null
  hyper_residual_log_diagnostics: True
  hyper_lora_rank: 4              # used when hyper_residual_mode=lora
  hyper_lora_actor_rank: null
  hyper_lora_value_rank: null
  hyper_lora_bias: False          # LoRA only adapts weights by default

# rf init CLOSED
  hyper_rf_init: False            # RF is off for the stable pre-RF baseline
  hyper_rf_mode: fan_in           # fan_in | fan_out | fan_avg
  hyper_rf_hidden_gain: 1.41421356237
  hyper_rf_actor_output_gain: 0.01
  hyper_rf_value_output_gain: 1.0
  hyper_rf_bias_scale: 1.0

  hyper_hidden: [64]
  value_hyper_hidden: [64]
  hyper_dropout: 0.0

  actor_hidden1: 64
  actor_hidden2: 64
  value_hidden: [64, 64]


trainer:
  learning_start: -1
  buffer_size: 1000
  steps: 3600
  test_steps: 3600
  action_interval: 10
  episodes: 250
  update_model_rate: 1
  update_target_rate: 1
  test_when_train: True
  test_interval: 5
  early_stop_patience: 0
  load_best_for_test: True


logger:
  save_rate: 200   # model save rate
  attention: False
