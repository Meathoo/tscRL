includes:
  - configs/tsc/base.yml


model:
  name: ppo
  train_model: True
  test_model: True
  load_model: False
  graphic: True

  phase: True
  one_hot: True       # use one-hot encoding for the phase input. If False, use 1,2,3,4
  state_features: ["lane_count", "lane_waiting_count"]
  vehicle_max: 50

  learning_rate: 0.0003
  adam_eps: 0.00001
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  clip_vf: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  reward_scale: 0.05
  grad_clip: 0.5

  ppo_epochs: 4
  ppo_rollout_steps: 360
  ppo_minibatch_size: 2048
  normalize_advantage: True
  test_action_mode: argmax        # argmax | sample
  test_temperature: 1.0

  activation: relu                 # relu | tanh
  native_use_agent_id: False        # append one-hot intersection id to shared MLP inputs
  native_agent_id_mode: one_hot    # one_hot | learned

  centralized_critic: False
  centralized_critic_mode: pooled # pooled | concat

  actor_hidden: [64, 64]
  actor_hidden1: 64
  actor_hidden2: 64
  value_hidden: [64, 64]


trainer:
  learning_start: -1
  buffer_size: 1000
  steps: 3600
  test_steps: 3600
  action_interval: 10
  episodes: 250
  update_model_rate: 1
  update_target_rate: 1
  test_when_train: True
  test_interval: 5
  # Counted in TEST evaluations, not episodes: test_interval is 5, so 8 means
  # training stops after 40 episodes without a new best.  That is a reasonable
  # rule where the TEST curve is smooth, and a trap where it is not.
  #
  # On Ingolstadt21 (sumo1x21) the TEST curve oscillates with a within-run
  # standard deviation of 30-45 travel-time units all the way through training,
  # so eight consecutive evaluations below the running best says nothing about
  # convergence.  mappo stopped there at episode 60-65 while dqn and colight ran
  # the full 250, which made the baseline table compare unequal budgets; re-run
  # at the full budget its best arrived at episode 195, long past the stop, and
  # travel time improved 249.15 -> 233.86 with queue and throughput following.
  #
  # Pass --early_stop_patience 0 to disable it whenever the evaluation is noisy
  # or whenever this family has to be compared against agents that run a fixed
  # budget.  Left at 8 so existing results stay reproducible.
  early_stop_patience: 8
  load_best_for_test: True


logger:
  save_rate: 20
  attention: False
